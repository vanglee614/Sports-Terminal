name: Sports Betting System Automation

on:
  schedule:
    # GitHub Action crons operate in UTC time.
    # 12:45 UTC is 8:45 AM EST (Early Line Catcher)
    - cron: '45 12 * * *'
    # 21:45 UTC is 5:45 PM EST (Late Injury & Line Movement Catcher)
    - cron: '45 21 * * *'
  workflow_dispatch: # Gives you a manual button in GitHub to run it anytime on command

jobs:
  run-algorithm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Initialize Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Math Filters Backend
        env:
          # Injects your secret safely into the environment
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }} 
        run: python main.py

      - name: Commit and Push Fresh Dashboard Data
        run: |
          git config --global user.name "System Automation Bot"
          git config --global user.email "bot@github.com"
          git add bets.json
          # Only push if data changed to avoid spamming repository commits
          git diff-index --quiet HEAD || (git commit -m "Automated Market Update: $(date)" && git push)
