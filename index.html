<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
  .tabs button { background: #1f1f1f; color: #fff; border: none; padding: 10px 20px; cursor: pointer; }
  .tabs button:hover { background: #333; }
  .card { background: #1e1e1e; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #bb86fc; }
</style>
</head>
<body>
  <div class="tabs">
    <button onclick="show('NBA')">NBA</button>
    <button onclick="show('MLB')">MLB</button>
    <button onclick="show('NHL')">NHL</button>
  </div>
  <div id="content"></div>
  <script>
    let sportsData = {};
    fetch('bets.json').then(r => r.json()).then(d => { sportsData = d; show('NBA'); });
    function show(s) {
      const container = document.getElementById('content');
      container.innerHTML = `<h2>${s}</h2>`;
      sportsData[s].forEach(g => {
        container.innerHTML += `<div class="card"><strong>${g.match}</strong><br>Lines loaded...</div>`;
      });
    }
  </script>
</body>
</html>
