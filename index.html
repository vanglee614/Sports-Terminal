<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tabs button { background: #1f1f1f; color: #bb86fc; border: 1px solid #bb86fc; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
  .tabs button:hover { background: #333; }
  .card { background: #1e1e1e; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #03dac6; }
</style>
</head>
<body>
  <div class="tabs">
    <button onclick="show('NBA')">NBA</button>
    <button onclick="show('MLB')">MLB</button>
    <button onclick="show('NHL')">NHL</button>
  </div>
  <div id="content"></div>
  <script>
    let data = {};
    fetch('bets.json').then(r => r.json()).then(d => { data = d; show('NBA'); });
    function show(s) {
      document.getElementById('content').innerHTML = `<h2>${s} Board</h2>` + 
        data[s].map(g => `<div class="card"><strong>${g.match}</strong></div>`).join('');
    }
  </script>
</body>
</html>
