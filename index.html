<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alpha Core System Terminal</title>
    <!-- Tailwind Engine Play CDN for seamless theme execution -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            background-color: #0b0f19;
        }
    </style>
</head>
<body class="text-gray-100 antialiased font-sans min-h-screen pb-12">

    <!-- TOP HEADER STATUS BAR -->
    <header class="sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 shadow-lg">
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                    <span id="status-pulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <h1 class="text-sm font-bold tracking-wider text-gray-300 uppercase">SYS: ACTIVE</h1>
            </div>
            <div class="text-right">
                <p id="update-time" class="text-xs text-gray-400 font-mono">Syncing pipeline...</p>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 mt-6 space-y-6">

        <!-- MODULE 1: THE HOME RUN ENGINE -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-black tracking-widest text-emerald-400 uppercase">⚡ HOME RUN ENGINE ($25 ──► $1000)</h2>
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20 font-mono">Barbell Matrix</span>
            </div>
            
            <div id="hr-container" class="space-y-4">
                <div class="animate-pulse bg-[#131c31] h-48 rounded-2xl border border-gray-800"></div>
            </div>
        </section>

        <!-- MODULE 2: THE GRIND ENGINE -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-xs font-black tracking-widest text-blue-400 uppercase">🛡️ THE GRIND ENGINE (Correlated SGPs)</h2>
                <span class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/20 font-mono">High Probability</span>
            </div>

            <div id="grind-container" class="space-y-2">
                <div class="animate-pulse bg-[#131c31] h-20 rounded-2xl border border-gray-800"></div>
            </div>
        </section>

    </main>

    <!-- CORE INTERACTION HANDLER -->
    <script>
        async function initTerminal() {
            try {
                const response = await fetch('bets.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Data payload missing');
                const data = await response.json();

                document.getElementById('update-time').innerText = `UPD: ${data.last_updated}`;

                const hrContainer = document.getElementById('hr-container');
                hrContainer.innerHTML = '';
                
                data.home_run_tickets.forEach((ticket, idx) => {
                    let legsHtml = '';
                    ticket.legs.forEach(leg => {
                        legsHtml += `
                            <div class="flex items-start space-x-3 py-2.5 border-b border-gray-800/60 last:border-0">
                                <span class="text-base mt-0.5">${leg.sport}</span>
                                <div class="flex-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-[9px] px-1.5 py-0.5 rounded font-black tracking-wide uppercase ${
                                            leg.trigger === 'INJURY EXPLOIT' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 
                                            leg.trigger === 'REVERSE LINE' ? 'bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20' : 
                                            'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20'
                                        }">${leg.trigger}</span>
                                    </div>
                                    <p class="text-sm font-semibold text-gray-200 mt-1">${leg.bet}</p>
                                </div>
                            </div>
                        `;
                    });

                    hrContainer.innerHTML += `
                        <div class="bg-[#131c31] rounded-2xl border border-gray-800 p-4 shadow-xl space-y-4">
                            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                                <div>
                                    <p class="text-[10px] uppercase tracking-wider text-gray-400 font-bold">Compiled Ticket #${idx + 1}</p>
                                    <p class="text-xl font-black text-gray-100 mt-0.5">${ticket.total_odds} <span class="text-xs text-emerald-400 font-medium">(${ticket.target_payout_multiplier})</span></p>
                                </div>
                                <button onclick="copyTicket(this, '${ticket.legs.map(l => l.bet).join('\\n')}')" class="bg-gray-800 active:bg-gray-700 text-xs font-bold text-gray-300 px-3 py-2 rounded-xl border border-gray-700 transition duration-150 flex items-center space-x-1.5">
                                    <span>Copy Legs</span>
                                </button>
                            </div>
                            <div class="space-y-1">${legsHtml}</div>
                        </div>
                    `;
                });

                const grindContainer = document.getElementById('grind-container');
                grindContainer.innerHTML = '';

                data.grind_tickets.forEach((ticket, idx) => {
                    let stepsHtml = '';
                    ticket.legs.forEach(leg => {
                        stepsHtml += `
                            <li class="flex items-center space-x-2 text-xs font-medium text-gray-300 py-1">
                                <span class="h-1 w-1 bg-blue-400 rounded-full"></span>
                                <span>${leg}</span>
                            </li>
                        `;
                    });

                    grindContainer.innerHTML += `
                        <div class="bg-[#131c31] rounded-xl border border-gray-800 overflow-hidden shadow-md">
                            <button onclick="toggleAccordion(this)" class="w-full text-left px-4 py-3.5 flex justify-between items-center active:bg-[#18233c] transition">
                                <div>
                                    <p class="text-sm font-bold text-gray-200">${ticket.game}</p>
                                </div>
                                <div class="flex items-center space-x-3">
                                    <span class="text-xs font-mono font-bold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">${ticket.total_odds}</span>
                                    <svg class="w-4 h-4 text-gray-400 transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </button>
                            <div class="hidden bg-[#0f172a]/40 px-4 pb-4 pt-1 border-t border-gray-800/40">
                                <ul class="space-y-1 mt-2">${stepsHtml}</ul>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                document.getElementById('status-pulse').classList.add('hidden');
                document.getElementById('status-dot').className = 'relative inline-flex rounded-full h-3 w-3 bg-rose-500';
                document.getElementById('update-time').innerText = 'CRITICAL RESYNC REQ';
                document.getElementById('update-time').classList.add('text-rose-400');
            }
        }

        function toggleAccordion(btn) {
            const panel = btn.nextElementSibling;
            const icon = btn.querySelector('svg');
            panel.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        function copyTicket(btn, text) {
            navigator.clipboard.writeText(text);
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="text-emerald-400 font-bold">Copied!</span>`;
            setTimeout(() => { btn.innerHTML = originalText; }, 2000);
        }

        window.onload = initTerminal;
    </script>
</body>
</html>
